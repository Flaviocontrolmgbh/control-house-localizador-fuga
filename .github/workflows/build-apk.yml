name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de teste
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ControlHouse-Localizador-de-Fuga.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ControlHouse-Localizador-de-Fuga-APK
          path: ControlHouse-Localizador-de-Fuga.apk
          retention-days: 30
